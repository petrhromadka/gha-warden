# Demonstrates: GW006 (secrets: inherit), GW008 (unsecure commands enabled),
# GW010 (hardcoded credential-looking literals).
# Also reported: GW003 (reusable workflow referenced by a branch).
# DO NOT copy this workflow. It is intentionally vulnerable.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY_PASSWORD: hunter2-not-real
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: registry.example.com
          username: release-bot
          password: hunter2-not-real

  deploy:
    needs: publish
    uses: example-org/shared-workflows/.github/workflows/deploy.yml@main
    secrets: inherit
