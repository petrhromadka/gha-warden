# Demonstrates: GW002 (PR code checked out from an issue_comment workflow, through a step
# output and through run steps) and GW017 (spoofable actor check).
# Also reported: GW003 (tags instead of commit SHAs), GW005 (checkout without
# persist-credentials: false).
# DO NOT copy this workflow. It is intentionally vulnerable.
name: Comment commands

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  # An attacker can make Dependabot the actor, for example by asking it to rebase
  # a pull request they control, so this check does not prove who wrote the code.
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - id: pr
        uses: xt0rted/pull-request-comment-branch@v3

      # The ref is the head commit of the pull request, resolved by the step above.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - run: npm ci && npm test

  checkout-by-hand:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh pr checkout ${{ github.event.issue.number }}
          make build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
