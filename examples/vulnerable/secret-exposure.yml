# Demonstrates: GW015 (whole secrets context, dynamic secret name, toJSON(github.event)
# pasted into a script), GW016 (secret interpolated into a run script).
# DO NOT copy this workflow. It is intentionally vulnerable.
name: Notify

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Hand every secret to a third-party action
        uses: example-org/notify-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v1.0.0
        with:
          credentials: ${{ toJSON(secrets) }}
          webhook: ${{ secrets[format('{0}_WEBHOOK', github.event.issue.user.login)] }}

      - name: Post to chat
        run: |
          echo "event: ${{ toJSON(github.event) }}"
          curl --header "Authorization: Bearer ${{ secrets.CHAT_TOKEN }}" https://chat.example.invalid/post
