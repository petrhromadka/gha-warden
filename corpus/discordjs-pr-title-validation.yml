# Case: Discord.js pr-triage workflow, PR title expression injection (GHSL-2024-145)
# Date: 2024-07-17
# Source: https://securitylab.github.com/advisories/GHSL-2024-145_Discord_js/
# Pattern: pull_request_target workflow assigns the PR title to a shell variable via ${{ }} inside
# the script body, so quotes in the title break out of the string. No permissions block: the
# advisory states the token had full write scopes through the org/repo default.
# Re-written minimal reproduction.
name: PR triage

on:
  pull_request_target:
    types: [opened, edited]

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          REGEX="^(feat|fix|docs|chore)(\(.+\))?: .{1,72}$"

          echo "Title: \"$TITLE\""

          if [[ ! "$TITLE" =~ $REGEX ]]; then
            exit 1
          fi
