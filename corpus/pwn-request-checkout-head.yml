# Case: Classic "pwn request" - pull_request_target with explicit checkout of the PR head, then build
# Date: 2021-08-03
# Source: https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
# Pattern: pull_request_target runs with secrets access; checking out the untrusted PR head and
# running npm install/build executes attacker-controlled scripts with those privileges.
# Re-written minimal reproduction of the documented INSECURE example; the third-party action is a
# placeholder. The permissions block is added by the reproduction.
name: Build and test

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4

      - run: |
          npm install
          npm run build

      - uses: example-org/deploy-action@v2
        with:
          arg1: ${{ secrets.DEPLOY_SECRET }}
