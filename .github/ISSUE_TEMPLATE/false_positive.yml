name: False positive
description: gha-warden reported a finding that is not a real problem
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: GW001
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Minimal workflow snippet
      description: The smallest YAML that still triggers the finding. Remove anything private.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Finding output
      description: The text output for the finding.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it safe?
      description: Explain why this usage cannot be exploited.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gha-warden version or commit
    validations:
      required: false
