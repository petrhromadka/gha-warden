name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest

  dogfood:
    name: Dogfood (scan own workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run gha-warden .github/workflows action.yml

  fuzz:
    name: Fuzz (Atheris, 2 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # atheris 3.1.0 has wheels for CPython 3.12 to 3.14 on manylinux x86_64.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --group fuzz
      - name: Fuzz the scanner
        run: |
          mkdir -p fuzz/work fuzz/artifacts
          uv run --locked --group fuzz python fuzz/fuzz_scan.py \
            -dict=fuzz/yaml.dict -max_total_time=120 -timeout=30 -max_len=8192 \
            -print_final_stats=1 -artifact_prefix=fuzz/artifacts/ \
            fuzz/work corpus examples
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  action:
    name: Run the composite action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Own workflows must be clean
        uses: ./
        with:
          paths: .github/workflows action.yml
          upload-sarif: "false"
      - name: Vulnerable examples must produce findings
        id: vulnerable
        uses: ./
        with:
          paths: examples/vulnerable
          upload-sarif: "false"
          annotations: "false"
          fail-on-findings: "false"
      - name: Check the action reported findings
        env:
          EXIT_CODE: ${{ steps.vulnerable.outputs.exit-code }}
        run: test "$EXIT_CODE" = "1"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t gha-warden:ci .
      - name: Own workflows must be clean
        run: |
          code=0
          docker run --rm -v "$PWD:/src" gha-warden:ci .github/workflows action.yml || code=$?
          echo "exit code: $code"
          test "$code" -eq 0
      - name: Vulnerable examples must produce findings
        run: |
          code=0
          docker run --rm -v "$PWD:/src" gha-warden:ci examples/vulnerable || code=$?
          echo "exit code: $code"
          test "$code" -eq 1
