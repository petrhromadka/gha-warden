name: gha-warden
description: Static security audit of GitHub Actions workflows, with optional SARIF upload to code scanning.
author: Petr Hromádka
branding:
  icon: shield
  color: red

inputs:
  paths:
    description: Space-separated workflow files or directories to scan.
    default: .github/workflows
  min-severity:
    description: >-
      Lowest severity to report (low, medium, high, critical). Empty uses min-severity from
      .gha-warden.toml, else low.
    default: ""
  format:
    description: Output format (text, json, sarif, github, markdown).
    default: sarif
  upload-sarif:
    description: Upload SARIF results to GitHub code scanning (the calling job needs security-events write).
    default: "true"
  annotations:
    description: Emit one workflow annotation per finding (the github format).
    default: "true"
  fail-on-findings:
    description: Fail the step when findings at or above min-severity exist.
    default: "true"

outputs:
  exit-code:
    description: Exit code of gha-warden (0 clean, 1 findings).
    value: ${{ steps.scan.outputs.exit-code }}
  report-file:
    description: Path of the report written in the requested format.
    value: ${{ steps.scan.outputs.report-file }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - id: scan
      shell: bash
      env:
        GW_PATHS: ${{ inputs.paths }}
        GW_MIN_SEVERITY: ${{ inputs.min-severity }}
        GW_FORMAT: ${{ inputs.format }}
        GW_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        GW_ANNOTATIONS: ${{ inputs.annotations }}
      run: |
        # `shell: bash` runs with -e; exit code 1 (findings) is handled below, so turn -e off.
        set +e -uo pipefail
        read -r -a targets <<< "$GW_PATHS"
        # Boolean inputs are compared case-insensitively, like the `if:` expressions are.
        upload_sarif="${GW_UPLOAD_SARIF,,}"
        annotations_enabled="${GW_ANNOTATIONS,,}"
        report="${RUNNER_TEMP}/gha-warden-report.${GW_FORMAT}"
        sarif="${RUNNER_TEMP}/gha-warden.sarif"

        # Without --min-severity the .gha-warden.toml value (else low) applies.
        severity_args=()
        if [ -n "$GW_MIN_SEVERITY" ]; then
          severity_args=(--min-severity "$GW_MIN_SEVERITY")
        fi

        run_scan() {
          uvx --from "${GITHUB_ACTION_PATH}" gha-warden "${targets[@]}" \
            "${severity_args[@]}" --format "$1" --output "$2" --no-color
        }

        # A report quotes text from the scanned files. Pause workflow-command processing under
        # a random token while printing it, so that text cannot act as ::add-mask:: and friends.
        print_report() {
          local token
          token="$(openssl rand -hex 16 2>/dev/null)" || token=""
          [ -n "$token" ] || token="${RANDOM}${RANDOM}${RANDOM}"
          echo "::stop-commands::${token}"
          cat "$1"
          echo "::${token}::"
        }

        run_scan "$GW_FORMAT" "$report"
        code=$?
        if [ "$code" -gt 1 ]; then
          echo "gha-warden failed with exit code ${code}" >&2
          exit "$code"
        fi
        if [ "$GW_FORMAT" != "sarif" ]; then
          if [ "$GW_FORMAT" = "github" ]; then
            # Annotations are workflow commands on purpose; gha-warden escapes their content.
            cat "$report"
          else
            print_report "$report"
          fi
          if [ "$upload_sarif" = "true" ]; then
            run_scan sarif "$sarif" || [ $? -eq 1 ] || exit 2
          fi
        else
          cp "$report" "$sarif"
        fi

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          summary="${RUNNER_TEMP}/gha-warden-summary.md"
          run_scan markdown "$summary" || [ $? -eq 1 ] || exit 2
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$annotations_enabled" = "true" ] && [ "$GW_FORMAT" != "github" ]; then
          annotations="${RUNNER_TEMP}/gha-warden-annotations.txt"
          run_scan github "$annotations" || [ $? -eq 1 ] || exit 2
          cat "$annotations"
        fi

        {
          echo "exit-code=${code}"
          echo "report-file=${report}"
          echo "sarif-file=${sarif}"
        } >> "$GITHUB_OUTPUT"

    - if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: gha-warden

    - if: inputs.fail-on-findings == 'true' && steps.scan.outputs.exit-code == '1'
      shell: bash
      run: |
        echo "gha-warden reported findings (see the report or code scanning alerts)." >&2
        exit 1
